server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name 172.20.10.5 localhost;

    # SSL Configuration
    ssl_certificate "/Users/thisaruramanayake/Downloads/cubot web/nginx-config/ssl/cubot.crt";
    ssl_certificate_key "/Users/thisaruramanayake/Downloads/cubot web/nginx-config/ssl/cubot.key";
    
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-RSA-AES128-GCM-SHA256:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-RSA-AES128-SHA256:ECDHE-RSA-AES256-SHA384;
    ssl_prefer_server_ciphers off;

    # Frontend Proxy (React/Vite)
    location / {
        proxy_pass http://127.0.0.1:5173;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
        
        # WebSocket support for Vite HMR
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 86400;
    }

    # Backend API Proxy (Flask)
    location /api/ {
        proxy_pass http://127.0.0.1:5001/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        
        # Handle large file uploads for cube images
        client_max_body_size 50M;
        proxy_request_buffering off;
    }
}

# Redirect HTTP to HTTPS
server {
    listen 80;
    listen [::]:80;
    server_name 172.20.10.5 localhost;
    return 301 https://$server_name$request_uri;
}
