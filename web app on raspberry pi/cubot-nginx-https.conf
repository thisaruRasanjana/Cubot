# HTTP server - redirects to HTTPS
server {
    listen 80;
    server_name 172.20.10.5 localhost;
    return 301 https://$server_name$request_uri;
}

# HTTPS server
server {
    listen 443 ssl http2;
    server_name 172.20.10.5 localhost;
    
    # SSL Configuration
    ssl_certificate /etc/nginx/ssl/cubot.crt;
    ssl_certificate_key /etc/nginx/ssl/cubot.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-RSA-AES256-GCM-SHA512:DHE-RSA-AES256-GCM-SHA512:ECDHE-RSA-AES256-GCM-SHA384:DHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;
    
    # Increase client max body size for image uploads
    client_max_body_size 50M;
    
    # Root directory for static files (built React app)
    root "/Users/thisaruramanayake/Desktop/hardware project2/web app on raspberry pi/dist";
    index index.html;
    
    # Error and access logs
    error_log /usr/local/var/log/nginx/cubot_error.log;
    access_log /usr/local/var/log/nginx/cubot_access.log;
    
    # Security headers for camera access
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Permissions-Policy "camera=*, microphone=*" always;
    
    # Serve static files from the built React app
    location / {
        try_files $uri $uri/ /index.html;
        add_header Access-Control-Allow-Origin "*";
        add_header Cache-Control "public, max-age=3600";
    }
    
    # Proxy API requests to Flask backend
    location /api/ {
        proxy_pass http://127.0.0.1:5002;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        
        # Timeouts
        proxy_connect_timeout 600s;  # 10 minutes for robot operations
        proxy_send_timeout 600s;     # 10 minutes for robot operations  
        proxy_read_timeout 600s;     # 10 minutes for robot operations
        
        # CORS headers
        add_header Access-Control-Allow-Origin "*" always;
        add_header Access-Control-Allow-Methods "GET, POST, PUT, DELETE, OPTIONS" always;
        add_header Access-Control-Allow-Headers "Content-Type, Authorization, X-Requested-With, X-Access-Token" always;
        
        # Handle preflight requests
        if ($request_method = 'OPTIONS') {
            add_header Access-Control-Allow-Origin "*";
            add_header Access-Control-Allow-Methods "GET, POST, PUT, DELETE, OPTIONS";
            add_header Access-Control-Allow-Headers "Content-Type, Authorization, X-Requested-With, X-Access-Token";
            add_header Content-Length 0;
            add_header Content-Type text/plain;
            return 200;
        }
    }
    
    # Serve uploaded files
    location /uploads/ {
        alias "/Users/thisaruramanayake/Desktop/hardware project2/web app on raspberry pi/uploads/";
        add_header Access-Control-Allow-Origin "*";
    }
    
    # Handle static assets
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        add_header Access-Control-Allow-Origin "*";
    }
}
